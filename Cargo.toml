[workspace]
resolver = "3"
members = [
    "crates/osier",
    "crates/osier-git",
    "crates/osier-config",
    "crates/osier-theme",
    "crates/osier-auth",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Rey Arlena <reyarlena@gmail.com>"]
license = "MIT"
repository = "https://github.com/ReyArlena/osier"
homepage = "https://github.com/ReyArlena/osier"
description = "Fast native git GUI for Linux"
keywords = ["git", "gui", "gpui", "desktop"]
categories = ["development-tools", "gui"]
publish = false

[workspace.dependencies]
# UI. Never add `gpui` or `gpui-pre` directly: gpui-kit pins its own snapshot.
gpui-kit = "=0.9.0"

# Shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
osier-git = { path = "crates/osier-git" }
osier-config = { path = "crates/osier-config" }
osier-theme = { path = "crates/osier-theme" }
osier-auth = { path = "crates/osier-auth" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
