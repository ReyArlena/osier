name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "site/**"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  # The release workflow runs these checks on the tagged commit before publishing.
  workflow_call:

# A newer push or PR update cancels the run still testing the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The jobs run in parallel. Caches are saved from main only: pull requests and tags restore
# main's, and caches saved under a PR or tag ref could not be reused by anything else.
jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        # Runs even when formatting failed, so one push reports both.
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-26.04
    env:
      # Line tables keep file:line in backtraces at a fraction of full debug info's build
      # time. Assertions and overflow checks are separate settings and stay on.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --workspace
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid

  # An early warning that the optimised build still compiles, links and starts, on main
  # (where releases are tagged from). The release workflow builds the real packages.
  release-build:
    name: release build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binary
        run: cargo build --release -p osier
      - name: Smoke test the binary
        run: target/release/osier --version --verbose

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
