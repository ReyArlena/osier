name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The full CI checks on the tagged commit, in parallel with the builds. Nothing is
  # published unless both pass.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so build.rs can tell this is exactly the release tag.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # A cache saved under a tag can only be restored by that same tag, so saving one
          # would only push main's caches out of the repository's 10 GB.
          save-if: false
      - name: Build
        run: cargo build --release -p osier --target ${{ matrix.target }}
      - name: Check the binary reports the tag's version
        run: |
          set -eu
          want="osier ${GITHUB_REF_NAME}"
          got="$(target/${{ matrix.target }}/release/osier --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got', expected '$want' (bump the version in Cargo.toml to match the tag)"
            exit 1
          fi
      - name: Package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="osier-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/osier" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          cp -r packaging/com.reyarlena.osier.desktop packaging/com.reyarlena.osier.askpass.desktop packaging/com.reyarlena.osier.metainfo.xml packaging/icons "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          # The bare binary under a version-free name, so
          # releases/latest/download/osier-linux-<arch> always points at the newest release.
          bin="osier-linux-${{ matrix.arch }}"
          install -m 755 "target/${{ matrix.target }}/release/osier" "dist/${bin}"
          (cd dist && sha256sum "${bin}" > "${bin}.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/osier-linux-*

  release:
    name: GitHub release
    needs: [ci, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the commits since the previous release can be listed.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes
        env:
          # For the authors' GitHub logins and GitHub's list of pull requests.
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # The commits by type, then the pull requests.
          body_path: ${{ runner.temp }}/notes.md
