name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so build.rs can tell this is exactly the release tag.
          fetch-depth: 0
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libfreetype-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p osier --target ${{ matrix.target }}
      - name: Check the binary reports the tag's version
        run: |
          set -eu
          want="osier ${GITHUB_REF_NAME}"
          got="$(target/${{ matrix.target }}/release/osier --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got', expected '$want' (bump the version in Cargo.toml to match the tag)"
            exit 1
          fi
      - name: Package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="osier-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/osier" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          cp -r packaging/com.reyarlena.osier.desktop packaging/com.reyarlena.osier.askpass.desktop packaging/com.reyarlena.osier.metainfo.xml packaging/icons "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
