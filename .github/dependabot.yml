version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # gpui-kit is pinned on purpose; upgrades are done by hand with the screenshot loop.
      - dependency-name: gpui-kit
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-reqwest-client
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
