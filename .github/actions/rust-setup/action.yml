name: Rust setup
description: Install the native libraries Osier builds against and the Rust version pinned in rust-toolchain.toml.

inputs:
  components:
    description: Extra rustup components, comma separated (e.g. "rustfmt, clippy").
    default: ""
  targets:
    description: Extra rustup targets, comma separated.
    default: ""

runs:
  using: composite
  steps:
    - name: Native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
          libwayland-dev libvulkan-dev libfontconfig1-dev libfreetype-dev libssl-dev git
    - name: Read the pinned Rust version
      id: rust
      shell: bash
      run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
