# cargo-deny configuration. Run: cargo deny check
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
# Unmaintained notices only matter for crates we depend on directly. Transitive ones live
# under gpui (font shaping, zbus) and are upstream's call.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OFL-1.1",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # Two gpui copies would be a silent disaster; everything goes through gpui-kit.
    { crate = "gpui", reason = "use gpui-kit's re-export" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
