[package]
name = "osier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
default-run = "osier"

[[bin]]
name = "osier"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true, features = [
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-php",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-diff",
] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify = "8"
# Zed's reqwest-based HttpClient for the gpui snapshot gpui-kit pins; same version, same crate graph.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
osier-git.workspace = true
osier-config.workspace = true
osier-theme.workspace = true
serde_json.workspace = true
osier-auth.workspace = true
# Local time zone for the full date and time in time tooltips. Already in the graph via gpui.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Developer builds only (`--features profiler`, see `src/profiling.rs`): gpui's frame profiler,
# switched on in gpui itself. Same exact snapshot gpui-kit pins, so still one copy of gpui.
# gpui-kit's own `profiler` feature can't be used: it names gpui-fast, whose pins conflict.
gpui-pre = { version = "=0.3.11", optional = true, default-features = false }

# The desktop's light/dark preference, read directly so "no preference" can be told apart from
# "prefer light" (gpui reports both as light). Same crate and features gpui's Linux platform uses.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
futures-util = { version = "0.3", default-features = false }

[features]
profiler = ["dep:gpui-pre", "gpui-pre/profiler"]

[dev-dependencies]
# gpui's own test harness, on the exact snapshot gpui-kit pins. Not gpui-kit's `test-support`
# feature: that one drags in gpui-fast with conflicting pins.
gpui-pre = { version = "=0.3.11", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
