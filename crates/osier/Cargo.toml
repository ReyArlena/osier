[package]
name = "osier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
default-run = "osier"

[[bin]]
name = "osier"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true, features = [
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-php",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-diff",
] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify = "8"
ignore = "0.4"
osier-git.workspace = true
osier-config.workspace = true
osier-theme.workspace = true
osier-auth.workspace = true

[lints]
workspace = true
